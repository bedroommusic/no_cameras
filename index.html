<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>No Cameras!</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%238d9cf2'/%3E%3Cstop%20offset='1'%20stop-color='%23b59cf0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='url%28%23g%29'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='14'%20fill='none'%20stroke='%23fff'%20stroke-width='6'/%3E%3Cpath%20d='M18%2046L46%2018'%20stroke='%23f2929f'%20stroke-width='6'%20stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#eef0f7;--ink:#262a36;--mute:#7d8498;--glass:rgba(255,255,255,.58);--edge:rgba(255,255,255,.8);--field:rgba(255,255,255,.65);--acc:#8d9cf2;--acc2:#b59cf0;--rec:#f2929f;--seg:#fff;--sh:0 12px 44px rgba(90,100,150,.16);--aur:.95}
@media(prefers-color-scheme:dark){:root{--bg:#13141a;--ink:#eceef5;--mute:#8b92a6;--glass:rgba(40,43,58,.55);--edge:rgba(255,255,255,.09);--field:rgba(255,255,255,.07);--seg:rgba(255,255,255,.17);--sh:0 12px 44px rgba(0,0,0,.45);--aur:.22}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;opacity:var(--aur);filter:blur(30px);background:radial-gradient(40% 35% at 12% 8%,#f8d0e0,transparent 70%),radial-gradient(42% 40% at 92% 22%,#d0d8fc,transparent 70%),radial-gradient(48% 42% at 68% 96%,#c9eee2,transparent 70%),radial-gradient(35% 30% at 8% 80%,#e4d6fa,transparent 70%)}
[hidden]{display:none!important}
input{font:inherit;color:inherit;background:var(--field);border:1px solid var(--edge);border-radius:14px;padding:14px 16px;outline:0;width:100%}
input::placeholder{color:var(--mute)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:500;color:inherit;border:1px solid var(--edge);border-radius:999px;padding:10px 16px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 2px 10px rgba(90,100,150,.08);cursor:pointer;white-space:nowrap;transition:transform .15s,background .2s}
button:active{transform:scale(.95)}
button.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(141,156,242,.42)}
.scr{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;gap:22px}
.brand{text-align:center}
h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{margin-top:8px;color:var(--mute)}
.card{background:var(--glass);backdrop-filter:blur(34px) saturate(1.6);-webkit-backdrop-filter:blur(34px) saturate(1.6);border:1px solid var(--edge);border-radius:30px;padding:22px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.mute{color:var(--mute);font-size:13px}
#am{text-align:center}
#qr{align-self:center;background:#fff;padding:12px;border-radius:18px}
#sec{word-break:break-all;font-size:12px;text-align:center;color:var(--mute);user-select:all}
.row{display:flex;gap:8px}.row>*{flex:1}
.row button{padding:10px 6px}
#app{position:relative;height:100%;display:flex;flex-direction:column}
.tab{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;margin:12px 14px 0;border-radius:36px;overflow:hidden;background:#12141a;position:relative;box-shadow:var(--sh),0 0 0 1px var(--edge)}
video{width:100%;height:100%;object-fit:cover;display:block}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.top button{background:rgba(20,22,30,.32);color:#fff;border:1px solid rgba(255,255,255,.16);padding:8px 14px;font-size:13px}
.top button.on{background:rgba(255,255,255,.88);color:#262a36;border-color:transparent}
#big{position:absolute;inset:0;display:grid;place-items:center;font-size:140px;font-weight:200;color:#fff;pointer-events:none;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.bar{display:flex;justify-content:center;align-items:center;height:112px}
.rec{width:84px;height:84px;border-radius:50%;padding:0;background:var(--glass);box-shadow:var(--sh);position:relative}
.rec::after{content:"";position:absolute;inset:9px;border-radius:50%;background:linear-gradient(145deg,#f8aab6,#ee8497);box-shadow:0 6px 22px rgba(240,130,150,.55);transition:inset .25s,border-radius .25s}
.rec.on::after{inset:27px;border-radius:9px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(240,130,150,.2)}}
#strip{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 0;scrollbar-width:none}
#ed{padding:8px 14px 0;display:flex;flex-direction:column;gap:6px}
label.r{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px}
label.r span{width:28px}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;padding:0;background:none;border:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(125,132,152,.3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(125,132,152,.3)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(20,22,30,.34);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
nav button{background:none;border:0;box-shadow:none;backdrop-filter:none;color:rgba(255,255,255,.78);padding:9px 20px}
nav button.p{background:rgba(255,255,255,.9);color:#262a36;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top,nav{transition:opacity .25s}
.rc .top,.rc nav{opacity:0;pointer-events:none}
#st{text-align:center;min-height:20px;padding:8px 14px 0}
#st a{color:var(--acc)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="auth" class="scr">
  <div class="brand"><h1>No Cameras!</h1><p>Shoot, trim, post.</p></div>
  <div class="card">
    <input id="u" placeholder="Username" autocapitalize="none" autocomplete="username">
    <div id="qr" hidden></div>
    <div id="sec"></div>
    <input id="c" placeholder="6-digit code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <div class="mute" id="am"></div>
    <div class="row"><button id="new">Create</button><button id="go" class="p">Sign in</button></div>
    <button id="skip">Skip, store locally</button>
  </div>
</section>

<section id="app" hidden>
  <div id="shoot" class="tab">
    <div class="stage">
      <video id="cam" autoplay muted playsinline></video>
      <div class="top">
        <button id="bf">Flip</button>
        <button id="bt">Timer off</button>
        <button id="bs">1×</button>
        <button id="bz" class="on">Stabilize</button>
        <button id="bn">Sound</button>
        <button id="so" aria-label="Sign out">✕</button>
      </div>
      <div id="big"></div>
      <nav><button data-t="shoot" class="p">Shoot</button><button data-t="edit">Edit</button></nav>
    </div>
    <div class="bar"><button id="rb" class="rec" aria-label="Record"></button></div>
  </div>

  <div id="edit" class="tab" hidden>
    <div class="stage"><video id="pv" playsinline></video>
      <nav><button data-t="shoot">Shoot</button><button data-t="edit" class="p">Edit</button></nav></div>
    <div id="strip"></div>
    <div id="ed" hidden>
      <label class="r"><span>In</span><input id="ia" type="range" step=".05" min="0"></label>
      <label class="r"><span>Out</span><input id="ib" type="range" step=".05" min="0"></label>
      <div class="row">
        <button id="ep">Play</button><button id="ec">Cut</button><button id="ey">Copy</button><button id="ed2">Delete</button><button id="ex" class="p">Export</button>
      </div>
    </div>
    <div id="st" class="mute"></div>
  </div>

</section>

<input id="snd" type="file" accept="audio/wav,audio/mpeg,video/mp4,.wav,.mp3,.mp4" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Cloud adapter: set to your endpoint (PUT {CLOUD_URL}/{user}/{file}). Empty = on-device IndexedDB.
const CLOUD_URL='';

/* ---------- TOTP (RFC 6238) ---------- */
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
const enc=a=>{let s='',b=0,v=0;for(const x of a){v=v<<8|x;b+=8;while(b>=5){s+=B32[(v>>b-5)&31];b-=5;v&=(1<<b)-1}}if(b)s+=B32[(v<<5-b)&31];return s};
const dec=s=>{let b=0,v=0,o=[];for(const c of s){v=v<<5|B32.indexOf(c);b+=5;if(b>=8){o.push((v>>b-8)&255);b-=8;v&=(1<<b)-1}}return new Uint8Array(o)};
const hotp=async(s,n)=>{const k=await crypto.subtle.importKey('raw',dec(s),{name:'HMAC',hash:'SHA-1'},false,['sign']);const m=new DataView(new ArrayBuffer(8));m.setUint32(4,n);const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,m.buffer)),o=h[19]&15;return String(((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6).padStart(6,'0')};
const verify=async(s,c)=>{const t=Math.floor(Date.now()/3e4);for(const d of[-1,0,1])if(await hotp(s,t+d)===c)return true;return false};

/* ---------- Auth ---------- */
let acc=JSON.parse(localStorage.acc||'{}'),user=sessionStorage.u,pend=null;
const msg=t=>$('#am').textContent=t;
$('#new').onclick=()=>{
  const u=$('#u').value.trim().toLowerCase();
  if(!u)return msg('Enter a username.');
  if(acc[u])return msg('Username taken.');
  const s=enc(crypto.getRandomValues(new Uint8Array(20)));pend={u,s};
  $('#qr').innerHTML='';$('#qr').hidden=false;
  if(window.QRCode)new QRCode($('#qr'),{text:`otpauth://totp/No%20Cameras:${encodeURIComponent(u)}?secret=${s}&issuer=No%20Cameras!`,width:148,height:148});
  $('#sec').textContent=s;msg('Scan in your authenticator app, then enter the code.');
};
$('#go').onclick=async()=>{
  const u=$('#u').value.trim().toLowerCase(),s=pend&&pend.u===u?pend.s:acc[u];
  if(!u)return msg('Enter a username.');
  if(!s)return msg('No account found. Tap Create.');
  if(!await verify(s,$('#c').value.trim()))return msg('Wrong code. Try the next one.');
  if(pend){acc[u]=s;localStorage.acc=JSON.stringify(acc);pend=null}
  sessionStorage.u=user=u;start();
};
$('#skip').onclick=()=>{sessionStorage.u=user='guest';start()};
$('#so').onclick=()=>{sessionStorage.clear();location.reload()};
function start(){$('#auth').hidden=true;$('#app').hidden=false;cam()}

/* ---------- Shooting ---------- */
let stream,facing='user',rec,chunks,t0,spd=1,tm=0,stab=true,aud=null;
const mime=()=>MediaRecorder.isTypeSupported('video/mp4')?'video/mp4':'video/webm';
async function cam(){
  stream&&stream.getTracks().forEach(t=>t.stop());
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1080},height:{ideal:1920}},audio:!aud})}
  catch(e){return $('#big').textContent=''}
  const v=$('#cam');v.srcObject=stream;v.style.transform=(facing==='user'?'scaleX(-1) ':'')+(stab?'scale(1.08)':'');
  stream.getVideoTracks()[0].applyConstraints({advanced:[{videoStabilizationMode:stab?'cinematic':'off'}]}).catch(()=>{});
}
$('#bf').onclick=()=>{facing=facing==='user'?'environment':'user';cam()};
$('#bt').onclick=e=>{tm=tm===0?3:tm===3?10:0;e.target.textContent=tm?`Timer ${tm}s`:'Timer off'};
$('#bs').onclick=e=>{spd=spd===1?2:spd===2?.5:1;e.target.textContent=spd+'×'};
$('#bz').onclick=e=>{stab=!stab;e.target.classList.toggle('on',stab);cam()};
$('#bn').onclick=()=>$('#snd').click();
$('#snd').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  aud=new Audio(URL.createObjectURL(f));
  $('#bn').textContent='♪ '+f.name.replace(/\.[^.]+$/,'').slice(0,12);$('#bn').classList.add('on');
  await cam();
};
$('#rb').onclick=async()=>{
  if(rec&&rec.state==='recording')return rec.stop();
  $('#app').classList.add('rc');
  for(let i=tm;i>0;i--){$('#big').textContent=i;await sleep(1000)}
  $('#big').textContent='';chunks=[];const mt=mime();
  rec=new MediaRecorder(stream,{mimeType:mt});
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{
    const d=(performance.now()-t0)/1e3;aud&&aud.pause();$('#rb').classList.remove('on');$('#app').classList.remove('rc');
    const blob=new Blob(chunks,{type:mt});clips.push({url:URL.createObjectURL(blob),dur:d,a:0,b:d,s:spd});sel=clips.length-1;
  };
  t0=performance.now();rec.start();if(aud){aud.currentTime=0;aud.play()}$('#rb').classList.add('on');
};

/* ---------- Edit ---------- */
let clips=[],sel=-1;
const pv=$('#pv'),cur=()=>clips[sel];
document.querySelectorAll('nav [data-t]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav [data-t]').forEach(x=>x.classList.toggle('p',x.dataset.t===b.dataset.t));
  $('#shoot').hidden=b.dataset.t!=='shoot';$('#edit').hidden=b.dataset.t!=='edit';
  if(b.dataset.t==='edit')list();
});
function list(){
  const st=$('#strip');st.innerHTML='';
  clips.forEach((c,i)=>{const b=document.createElement('button');b.textContent=`${i+1}  ${(c.b-c.a).toFixed(1)}s  ${c.s}×`;if(i===sel)b.className='p';b.onclick=()=>{sel=i;list()};st.append(b)});
  const c=cur();$('#ed').hidden=!c;if(!c)return;
  if(pv.dataset.u!==c.url){pv.src=pv.dataset.u=c.url}
  pv.defaultPlaybackRate=pv.playbackRate=c.s;
  $('#ia').max=$('#ib').max=c.dur;$('#ia').value=c.a;$('#ib').value=c.b;
}
pv.ontimeupdate=()=>{const c=cur();if(c&&pv.currentTime>=c.b)pv.pause()};
$('#ia').oninput=e=>{const c=cur();c.a=Math.min(+e.target.value,c.b-.1);pv.currentTime=c.a;list()};
$('#ib').oninput=e=>{const c=cur();c.b=Math.max(+e.target.value,c.a+.1);pv.currentTime=Math.max(c.a,c.b-.3);list()};
$('#ep').onclick=()=>{const c=cur();if(!pv.paused)return pv.pause();if(pv.currentTime>=c.b-.05||pv.currentTime<c.a)pv.currentTime=c.a;pv.play()};
$('#ec').onclick=()=>{const c=cur(),t=pv.currentTime;if(t>c.a+.1&&t<c.b-.1){clips.splice(sel+1,0,{...c,a:t});c.b=t;list()}};
$('#ey').onclick=()=>{clips.splice(sel+1,0,{...cur()});sel++;list()};
$('#ed2').onclick=()=>{clips.splice(sel,1);sel=Math.min(sel,clips.length-1);pv.removeAttribute('src');delete pv.dataset.u;list()};

/* ---------- Export + storage ---------- */
const st=t=>$('#st').innerHTML=t;
async function save(name,blob){
  if(CLOUD_URL&&user!=='guest'){const r=await fetch(`${CLOUD_URL}/${user}/${name}`,{method:'PUT',body:blob,headers:{'X-User':user}});if(!r.ok)throw 0;return}
  const db=await new Promise(r=>{const q=indexedDB.open('reel',1);q.onupgradeneeded=()=>q.result.createObjectStore('v');q.onsuccess=()=>r(q.result)});
  db.transaction('v','readwrite').objectStore('v').put(blob,user+'/'+name);
}
$('#ex').onclick=async()=>{
  if(!clips.length)return;st('Rendering in real time…');
  const W=720,H=1280,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const g=cv.getContext('2d'),ac=new AudioContext(),dst=ac.createMediaStreamDestination(),v=document.createElement('video');
  v.playsInline=true;ac.createMediaElementSource(v).connect(dst);
  let a2;if(aud){a2=new Audio(aud.src);ac.createMediaElementSource(a2).connect(dst)}
  const mt=mime(),out=new MediaStream([...cv.captureStream(30).getTracks(),...dst.stream.getTracks()]);
  const r=new MediaRecorder(out,{mimeType:mt}),ch=[];r.ondataavailable=e=>ch.push(e.data);
  const done=new Promise(res=>r.onstop=res);r.start();a2&&a2.play();
  for(const c of clips){
    v.src=c.url;await new Promise(x=>v.onloadedmetadata=x);
    v.currentTime=c.a+.001;await new Promise(x=>v.onseeked=x);
    v.defaultPlaybackRate=v.playbackRate=c.s;await v.play();
    await new Promise(res=>{const f=()=>{
      const k=Math.max(W/v.videoWidth,H/v.videoHeight),w=v.videoWidth*k,h=v.videoHeight*k;
      g.drawImage(v,(W-w)/2,(H-h)/2,w,h);
      if(v.currentTime>=c.b||v.ended){v.pause();res()}else requestAnimationFrame(f)};f()});
  }
  a2&&a2.pause();r.stop();await done;ac.close();
  const blob=new Blob(ch,{type:mt}),name=`nocameras-${Date.now()}.${mt.includes('mp4')?'mp4':'webm'}`,url=URL.createObjectURL(blob);
  let cloud='saved';try{await save(name,blob)}catch(e){cloud='not saved'}
  st(`Done · ${cloud} · <a href="${url}" download="${name}">Download</a>`);
};

if(user&&(user==='guest'||acc[user]))start();
</script>
</body>
</html>
